<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muzički kviz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0F0F14;
    --povrs: #1A1A22;
    --povrs-2: #16161D;
    --linija: #2A2A35;
    --tekst: #F2F2F5;
    --slab: #9A9AAE;
    --bled: #6E6E82;
    --akcenat: #C8FF4D;
    --akcenat-tekst: #0F0F14;
    --tacno: #C8FF4D;
    --tacno-bg: #1C2410;
    --netacno: #FF6B9D;
    --netacno-bg: #2A1520;
    --upozorenje-bg: #3A3014;
    --upozorenje-tekst: #F5DC8C;
    --naslovni: "Space Grotesk", system-ui, sans-serif;
    --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 16px/1.45 var(--font); }
  .omotac { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: grid; gap: 14px; margin-bottom: 16px; }
  .naslovni-red { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 1.3rem/1 var(--naslovni); letter-spacing: -.02em; }
  h2 { margin: 0 0 6px; font: 700 1.25rem/1.2 var(--naslovni); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--akcenat); outline-offset: 2px; }

  /* Režimi */
  .segment { display: flex; gap: 6px; padding: 4px; background: var(--povrs); border-radius: 14px; }
  .segment button {
    flex: 1; min-height: 44px; padding: 6px 10px; border: 0; border-radius: 10px;
    background: transparent; font-weight: 600; color: var(--slab);
  }
  .segment button[aria-pressed="true"] { background: var(--akcenat); color: var(--akcenat-tekst); font-weight: 700; }

  /* Scena: YouTube plejer ispod, gramofon preko njega */
  .scena { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 20px; overflow: hidden; }
  #plejer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .zaklon {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6%;
    padding: 4% 6%; background: var(--povrs-2); border: 1px solid var(--linija); border-radius: 20px;
    pointer-events: none; /* dodir prolazi do YouTube plejera (bitno za iOS) */
    --prsten: var(--akcenat);
  }
  .zaklon.netacno { --prsten: var(--netacno); }
  .ploca-okvir {
    --p: 0;
    position: relative; flex: none; height: 86%; aspect-ratio: 1 / 1; border-radius: 50%;
    background: conic-gradient(var(--prsten) calc(var(--p) * 360deg), var(--linija) 0);
  }
  .ploca {
    position: absolute; inset: 4%; border-radius: 50%; display: grid; place-items: center;
    background: repeating-radial-gradient(circle, #121218 0 3px, #1C1C24 3px 5px);
    animation: vrti 3.2s linear infinite paused;
  }
  .etiketa {
    width: 36%; aspect-ratio: 1 / 1; border-radius: 50%; background: var(--prsten);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .etiketa::after { content: ""; position: absolute; width: 12%; aspect-ratio: 1 / 1; border-radius: 50%; background: var(--bg); }
  .etiketa span {
    position: absolute; top: 16%; left: 0; right: 0; text-align: center; color: var(--akcenat-tekst);
    font: 700 clamp(7px, 2vw, 10px)/1 var(--naslovni); letter-spacing: .06em; text-transform: uppercase;
  }
  .zaklon-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .zaklon-malo { font-size: 12px; color: var(--slab); text-transform: uppercase; letter-spacing: .12em; }
  .zaklon-veliko { font: 700 clamp(40px, 13vw, 68px)/1 var(--naslovni); font-variant-numeric: tabular-nums; color: var(--tekst); }
  .zaklon.netacno .zaklon-veliko { color: var(--netacno); }
  .zaklon.tacno .zaklon-veliko { color: var(--tacno); }
  .ekvilajzer { display: flex; align-items: flex-end; gap: 4px; height: 26px; margin-top: 6px; }
  .ekvilajzer span {
    width: 6px; height: 100%; border-radius: 3px; background: var(--prsten); opacity: .35;
    transform: scaleY(.18); transform-origin: bottom;
  }
  .zaklon.svira .ploca { animation-play-state: running; }
  .zaklon.svira .ekvilajzer span { opacity: 1; animation: skok .9s ease-in-out infinite; }
  .zaklon.svira.tiho .ekvilajzer span { animation-name: skok-tiho; opacity: .6; }
  .ekvilajzer span:nth-child(1) { animation-delay: -.15s; }
  .ekvilajzer span:nth-child(2) { animation-delay: -.55s; animation-duration: .75s; }
  .ekvilajzer span:nth-child(3) { animation-delay: -.35s; animation-duration: 1.05s; }
  .ekvilajzer span:nth-child(4) { animation-delay: -.7s; }
  .ekvilajzer span:nth-child(5) { animation-delay: -.25s; animation-duration: .8s; }
  .ekvilajzer span:nth-child(6) { animation-delay: -.6s; animation-duration: 1.1s; }
  .ekvilajzer span:nth-child(7) { animation-delay: -.45s; animation-duration: .85s; }
  @keyframes vrti { to { transform: rotate(360deg); } }
  @keyframes skok { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  @keyframes skok-tiho { 0%, 100% { transform: scaleY(.15); } 50% { transform: scaleY(.45); } }
  @media (prefers-reduced-motion: reduce) {
    .zaklon.svira .ploca { animation: none; }
    .zaklon.svira .ekvilajzer span { animation: none; transform: scaleY(.6); }
  }

  .savet { margin: 10px 2px 0; font-size: .9rem; color: var(--slab); }
  .savet:empty { display: none; }

  .panel { margin-top: 16px; display: grid; gap: 14px; }
  .panel[hidden] { display: none; }
  .opis { margin: 0; color: var(--slab); }
  .info { margin: 0; font-size: .85rem; color: var(--slab); }

  /* Traka iznad odgovora: napredak, niz, rezultat */
  .traka-igre { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .traka-igre .napredak { font: 700 1.1rem var(--naslovni); margin-right: auto; }
  .traka-igre .napredak small { color: var(--bled); font-size: .9rem; }
  .cip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px;
    background: var(--povrs); border: 1px solid var(--linija); font-size: .9rem; font-weight: 700;
  }
  .cip:empty, .cip[hidden] { display: none; }
  .cip b { color: var(--akcenat); }
  .cip svg { flex: none; }

  /* Dugmad */
  .dugme {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px;
    padding: 10px 16px; border-radius: 16px; border: 1px solid var(--linija); background: var(--povrs);
    font: 700 1.02rem var(--naslovni); color: var(--tekst);
  }
  .dugme.primarno { background: var(--akcenat); border-color: var(--akcenat); color: var(--akcenat-tekst); }
  .dugme.primarno:disabled { background: var(--povrs); border-color: var(--linija); color: var(--bled); }
  .dugme.strelica::after { content: "→"; font-size: 1.15em; line-height: 1; }
  .dugme.malo { width: auto; min-height: 36px; padding: 4px 12px; border-radius: 999px; font: 600 .9rem var(--font); }
  .dugmad { display: grid; gap: 10px; }
  .dugmad:empty { display: none; }

  /* Odgovor */
  .odgovor { display: grid; gap: 4px; }
  .odgovor:empty { display: none; }
  .odgovor .presuda { font-weight: 700; font-size: .95rem; color: var(--slab); }
  .odgovor .presuda.tacno { color: var(--tacno); }
  .odgovor .presuda.netacno { color: var(--netacno); }
  .odgovor .naziv { font: 700 1.6rem/1.15 var(--naslovni); letter-spacing: -.01em; }
  .odgovor .naziv span { color: var(--slab); font-weight: 500; }
  .odgovor .dodatak { font-size: .9rem; color: var(--slab); }

  /* Ponude 2×2 */
  .ponude { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ponude:empty { display: none; }
  .ponuda {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 112px; padding: 12px;
    text-align: left; border: 2px solid var(--linija); border-radius: 16px; background: var(--povrs-2); color: var(--tekst);
  }
  .ponuda .broj {
    flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--boja); color: var(--akcenat-tekst); font: 700 .9rem var(--naslovni);
  }
  .ponuda .tekst { display: grid; gap: 2px; }
  .ponuda .tekst b { font: 700 1.05rem/1.2 var(--naslovni); }
  .ponuda .tekst span { font-size: .9rem; color: #C9C9D6; line-height: 1.3; }
  .ponuda:nth-child(1) { --boja: #C8FF4D; }
  .ponuda:nth-child(2) { --boja: #FF6B9D; }
  .ponuda:nth-child(3) { --boja: #5CC8FF; }
  .ponuda:nth-child(4) { --boja: #FFB547; }
  .ponuda:not(:disabled):hover { border-color: var(--boja); }
  .ponuda.tacno { border-color: var(--tacno); background: var(--tacno-bg); --boja: var(--tacno); }
  .ponuda.netacno { border-color: var(--netacno); background: var(--netacno-bg); --boja: var(--netacno); }
  .ponuda:disabled:not(.tacno):not(.netacno) { opacity: .4; }

  .opcija { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .opcija input { width: 22px; height: 22px; accent-color: var(--akcenat); }
  .opcija[hidden] { display: none; }

  details { border-top: 1px solid var(--linija); padding-top: 12px; }
  summary { cursor: pointer; font-weight: 700; min-height: 32px; }
  .lista-gresaka { margin: 8px 0 12px; padding-left: 1.4em; }
  .lista-gresaka li { margin: 4px 0; }
  .lista-gresaka .brojke { color: var(--slab); font-size: .9rem; white-space: nowrap; }

  /* Kraj runde */
  .rezultat { margin: 0; font: 700 3.4rem/1 var(--naslovni); font-variant-numeric: tabular-nums; }
  .rezultat span { color: var(--bled); }
  .statistike { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 6px 0; }
  .statistika { background: var(--povrs); border: 1px solid var(--linija); border-radius: 14px; padding: 10px 12px; }
  .statistika div { font: 700 1.3rem var(--naslovni); color: var(--akcenat); }
  .statistika small { color: var(--slab); font-size: .82rem; }
  .kraj-lista { margin: 0; padding-left: 1.3em; }
  .kraj-lista li { margin: 3px 0; }

  .upozorenje { background: var(--upozorenje-bg); color: var(--upozorenje-tekst); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
  .upozorenje[hidden] { display: none; }

  .obavestenje {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
    width: calc(100% - 32px); max-width: 528px; padding: 12px 14px; border-radius: 14px;
    background: #F2F2F5; color: #0F0F14; box-shadow: 0 6px 24px rgba(0,0,0,.4); font-size: .95rem; font-weight: 500;
  }
  .obavestenje[hidden] { display: none; }

  footer { margin-top: 22px; text-align: center; font-size: .8rem; color: var(--bled); }
</style>
</head>
<body>
<div class="omotac">
  <header>
    <div class="naslovni-red">
      <h1>
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#C8FF4D" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="12"></circle><circle cx="14" cy="14" r="8" stroke-opacity=".4"></circle><circle cx="14" cy="14" r="4"></circle></svg>
        muzički kviz
      </h1>
    </div>
    <div class="segment" role="group" aria-label="Režim">
      <button type="button" data-rezim="ucenje">Učenje</button>
      <button type="button" data-rezim="vezba">Vežba</button>
      <button type="button" data-rezim="test">Test</button>
    </div>
  </header>

  <main>
    <div class="scena">
      <div id="plejer"></div>
      <div class="zaklon" id="zaklon" aria-hidden="true">
        <div class="ploca-okvir" id="ploca">
          <div class="ploca"><div class="etiketa"><span id="etiketa"></span></div></div>
        </div>
        <div class="zaklon-info">
          <div class="zaklon-malo" id="zaklonMalo"></div>
          <div class="zaklon-veliko" id="zaklonVeliko">♪</div>
          <div class="ekvilajzer"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <p class="savet" id="savet"></p>

    <!-- POČETNI EKRAN -->
    <section class="panel" id="panelStart">
      <div class="upozorenje" id="upozorenje" hidden></div>
      <p class="opis" id="opisRezima"></p>
      <label class="opcija" id="opcijaCeste" hidden>
        <input type="checkbox" id="samoCeste">
        <span>Samo kompozicije koje često grešim</span>
      </label>
      <button type="button" class="dugme primarno" id="btnPocni" disabled></button>
      <p class="info" id="infoLista"></p>
      <p class="info" id="infoGlas"></p>
      <details id="detaljiGresaka" hidden>
        <summary>Najčešće greške</summary>
        <ol class="lista-gresaka" id="listaGresaka"></ol>
        <button type="button" class="dugme malo" id="btnObrisi"></button>
      </details>
    </section>

    <!-- IGRA -->
    <section class="panel" id="panelIgra" hidden>
      <div class="traka-igre">
        <span class="napredak" id="napredak"></span>
        <span class="cip" id="cipNiz" hidden></span>
        <span class="cip" id="skor" hidden></span>
        <button type="button" class="dugme malo" id="btnPrekini">Prekini</button>
      </div>
      <div class="odgovor" id="odgovor" aria-live="polite"></div>
      <div class="ponude" id="ponude"></div>
      <div class="dugmad" id="dugmad"></div>
    </section>

    <!-- KRAJ RUNDE -->
    <section class="panel" id="panelKraj" hidden>
      <div id="kraj"></div>
      <div class="dugmad" id="krajDugmad"></div>
    </section>
  </main>

  <footer>Muzika se pušta sa YouTube-a. Potrebna je internet veza.</footer>
</div>
<div class="obavestenje" id="obavestenje" role="status" hidden></div>

<script>

   --------------------------------------------------------------------------

     { kompozitor: "Ime", naslov: "Naziv dela", youtubeId: "xxxxxxxxxxx", start: 30 },

   - youtubeId: 11 znakova iz YouTube linka.
       https://www.youtube.com/watch?v=SSypujlLlNI  ->  "SSypujlLlNI"
       https://youtu.be/SSypujlLlNI                 ->  "SSypujlLlNI"

       (npr. brojevi: "Simfonija broj pet, prvi stav").

/* Podešavanja (sekunde) */
const PODESAVANJA = {
  UCENJE_SEK: 8,              // koliko se sluša u Učenju pre nego što glas kaže naziv
  VEZBA_SEK: 10,              // koliko se sluša u Vežbi
  TEST_SEK: 10,               // koliko se sluša u Testu
  GLASNOCA_ISPOD_GLASA: 15,   // jačina muzike (0–100) dok glas govori u Učenju
  PAUZA_POSLE_GLASA_MS: 1200, // pauza pre sledeće kompozicije u Učenju
};

/* ========================================================================== */

const $ = id => document.getElementById(id);

const LISTA = KOMPOZICIJE.filter(k => {
  const ok = k && k.kompozitor && k.naslov && /^[A-Za-z0-9_-]{11}$/.test(k.youtubeId || '');
  if (!ok) console.warn('Preskačem neispravnu stavku u listi:', k);
  return ok;
});

/* ---------- Čuvanje napretka ---------- */
const KLJUC = 'muzkviz.v1';
function ucitajSacuvano() {
  try { return JSON.parse(localStorage.getItem(KLJUC)) || {}; } catch (e) { return {}; }
}
const sacuvano = ucitajSacuvano();
if (!sacuvano.statistika || typeof sacuvano.statistika !== 'object') sacuvano.statistika = {};
function sacuvaj() {
  try { localStorage.setItem(KLJUC, JSON.stringify(sacuvano)); } catch (e) { /* privatni režim i sl. */ }
}
const kljucStavke = k => k.kompozitor + ' – ' + k.naslov;
function zabeleziOdgovor(k, tacno) {
  const s = sacuvano.statistika[kljucStavke(k)] || { tacno: 0, pogresno: 0 };
  if (tacno) s.tacno++; else s.pogresno++;
  s.poslednje = Date.now();
  sacuvano.statistika[kljucStavke(k)] = s;
  sacuvaj();
}
const statistikaZa = k => sacuvano.statistika[kljucStavke(k)];
function indeksiCestihGresaka() {
  return LISTA.map((k, i) => i).filter(i => {
    const s = statistikaZa(LISTA[i]);
    return s && s.pogresno > 0 && s.pogresno >= s.tacno;
  });
}

/* ---------- Stanje ---------- */
let rezim = ['ucenje', 'vezba', 'test'].includes(sacuvano.rezim) ? sacuvano.rezim : 'ucenje';
let faza = 'start';   // start | slusanje | glas | ceka | otkriveno | kraj
let runda = null;     // { red, poz, tacno, odgovoreno, pogresne, preskocene, niz, najduziNiz, najbrze }
let gen = 0;          // raste pri svakoj promeni kompozicije; poništava zakasnele tajmere
let ui = { odgovor: false, ponude: [], izabrano: null, najavljeno: false, govori: false };

let player = null, plejerSpreman = false, apiGreska = false, fileGreska = false;
let ytStanje = -1, t0 = null, proteklo = 0, ucitanoU = 0;
let potvrdaBrisanja = false, tajmerBrisanja = 0;

const kompozitor = k => k.kompozitor;
const delo = k => k.naslov;
const naziv = k => kompozitor(k) + ' – ' + delo(k);
const trenutnaIdx = () => runda.red[runda.poz];
const trenutna = () => LISTA[trenutnaIdx()];
const limit = () => (rezim === 'ucenje' ? PODESAVANJA.UCENJE_SEK : rezim === 'vezba' ? PODESAVANJA.VEZBA_SEK : PODESAVANJA.TEST_SEK);
const uIgri = () => ['slusanje', 'glas', 'ceka', 'otkriveno'].includes(faza);

function promesaj(niz) {
  const a = niz.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Glas (Web Speech API) ---------- */
const imaSintezu = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let glas = null, aktivniIzgovor = null, aktivniZvuk = null;

function izaberiGlas() {
  if (!imaSintezu) return;
  const glasovi = speechSynthesis.getVoices();
  const jezik = v => (v.lang || '').toLowerCase().replace('_', '-');
  const nadji = test => glasovi.find(v => test(jezik(v)));
  glas = nadji(l => l.startsWith('sr-latn')) || nadji(l => l.startsWith('sr'))
      || nadji(l => l.startsWith('hr')) || nadji(l => l.startsWith('bs'))
      || glasovi.find(v => v.default) || glasovi[0] || null;
  if (faza === 'start') renderStart();
}
if (imaSintezu) speechSynthesis.onvoiceschanged = izaberiGlas;

// Jedan zvučnik za snimljene najave. iOS pušta zvuk iz tajmera samo na elementu koji je
// već jednom pokrenut dodirom, pa ga "Počni" otključa kratkom tišinom.
const zvucnik = new Audio();
const TISINA = (() => {
  const n = 882, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const pisi = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  pisi(0, 'RIFF'); v.setUint32(4, 36 + n, true); pisi(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 44100, true); v.setUint32(28, 88200, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); pisi(36, 'data'); v.setUint32(40, n, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
})();

// iOS dozvoljava govor i zvuk tek posle prvog pokretanja dodirom.
function otkljucajGlas() {
  try { zvucnik.src = TISINA; zvucnik.play().catch(() => {}); } catch (e) { /* ništa */ }
  if (!imaSintezu) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ništa */ }
}

function zaustaviGlas() {
  try { if (imaSintezu) speechSynthesis.cancel(); } catch (e) { /* ništa */ }
  if (aktivniZvuk) { aktivniZvuk.onended = aktivniZvuk.onerror = aktivniZvuk.onloadedmetadata = null; aktivniZvuk.pause(); aktivniZvuk = null; }
}

const tekstZaIzgovor = k => k.izgovor || (k.kompozitor + '. ' + k.naslov).replace(/\bbr\.\s*/g, 'broj ');

// Izgovara naziv (mp3 iz liste ako postoji, inače sinteza, inače samo tekst na ekranu).
function izgovori(k, g, gotovo) {
  const tekst = tekstZaIzgovor(k);
  let gotov = false, sigurnost = 0;
  const zavrsi = () => {
    if (gotov) return;
    gotov = true;
    clearTimeout(sigurnost);
    if (g === gen) gotovo();
  };
  const postaviSigurnost = ms => { clearTimeout(sigurnost); sigurnost = setTimeout(zavrsi, ms); };
  const sinteza = () => {
    if (gotov || g !== gen) return;
    if (!imaSintezu || !glas) { postaviSigurnost(2500 + tekst.length * 60); return; } // samo tekst
    postaviSigurnost(4000 + tekst.length * 130); // ako onend izostane
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(tekst);
      u.voice = glas;
      u.lang = glas.lang;
      u.rate = 0.95;
      u.onend = zavrsi;
      u.onerror = zavrsi;
      aktivniIzgovor = u; // čuva referencu (Chrome inače ponekad ne javi onend)
      speechSynthesis.speak(u);
    } catch (e) {
      console.warn('Izgovor nije uspeo:', e);
    }
  };
  if (k.audio) {
    postaviSigurnost(15000);
    const a = zvucnik;
    aktivniZvuk = a;
    a.src = k.audio;
    a.onloadedmetadata = () => { if (isFinite(a.duration)) postaviSigurnost(a.duration * 1000 + 2000); };
    a.onended = zavrsi;
    a.onerror = sinteza;
    a.play().catch(sinteza);
  } else {
    sinteza();
  }
}

/* ---------- YouTube plejer ---------- */
window.onYouTubeIframeAPIReady = function () {
  const vars = { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0 };
  if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
  player = new YT.Player('plejer', {
    host: 'https://www.youtube-nocookie.com',
    width: '100%',
    height: '100%',
    videoId: LISTA.length ? LISTA[0].youtubeId : undefined,
    playerVars: vars,
    events: {
      onReady: () => { plejerSpreman = true; renderStart(); },
      onStateChange: e => naPromenuStanja(e.data),
      onError: e => naGresku(e.data),
    },
  });
};
window.apiNijeUcitan = function () { apiGreska = true; renderStart(); };
setTimeout(() => { if (!plejerSpreman && !apiGreska) { apiGreska = true; renderStart(); } }, 20000);

function naPromenuStanja(s) {
  ytStanje = s;
  renderAnimacija();
  if (faza !== 'slusanje') return;
  if (s === 1 && t0 === null) {
    const vd = player.getVideoData ? player.getVideoData() : null;
    if (vd && vd.video_id && vd.video_id !== trenutna().youtubeId) return; // još svira prethodni
    t0 = player.getCurrentTime();
    postaviSavet('');
  }
  if (s === 0) krajSlusanja(); // video se završio pre isteka vremena
}

function naGresku(kod) {
  const k = runda && uIgri() ? trenutna() : null;
  console.warn('YouTube greška', kod, k ? kljucStavke(k) + ' (' + k.youtubeId + ')' : '');
  if (kod === 153) {
    // Plejer nije dobio adresu stranice (najčešće fajl otvoren sa diska).
    fileGreska = true;
    if (uIgri()) prekini(); else renderStart();
    return;
  }
  if (!k) return;
  runda.preskocene.push(trenutnaIdx());
  obavesti(naziv(k) + ': ' + ('video nije dostupan (greška ' + kod + '). Preskačem.'));
  const g = gen;
  setTimeout(() => { if (g === gen) sledeca(); }, 1500);
}

function utisaj(cilj, g, gotovo) {
  let od = 100;
  try { od = player.getVolume(); } catch (e) { /* ništa */ }
  const koraka = 8;
  let i = 0;
  const id = setInterval(() => {
    if (g !== gen) { clearInterval(id); return; }
    i++;
    try { player.setVolume(Math.round(od + (cilj - od) * i / koraka)); } catch (e) { /* ništa */ }
    if (i >= koraka) { clearInterval(id); if (gotovo) gotovo(); }
  }, 80);
}

// Tajmer meri vreme samog videa, pa reklame i baferovanje ne troše sekunde.
setInterval(() => {
  if (faza !== 'slusanje' || !player) return;
  if (t0 === null) {
    if (Date.now() - ucitanoU > 5000) postaviSavet('Ako muzika ne krene, dodirni ploču.');
    return;
  }
  if (ytStanje === 2) postaviSavet('Pauzirano – dodirni ploču da nastaviš.');
  if (ytStanje !== 1) return;
  postaviSavet('');
  proteklo = Math.max(0, player.getCurrentTime() - t0);
  renderTajmer();
  if (proteklo >= limit()) krajSlusanja();
}, 100);

/* ---------- Tok igre ---------- */
function pocniRundu(indeksi) {
  if (!plejerSpreman || !indeksi.length) return;
  if (rezim === 'test' && new Set(LISTA.map(kljucStavke)).size < 4) {
    obavesti('Za test su potrebne bar 4 različite kompozicije u listi.');
    return;
  }
  otkljucajGlas();
  runda = { red: promesaj(indeksi), poz: -1, tacno: 0, odgovoreno: 0, pogresne: [], preskocene: [],
    niz: 0, najduziNiz: 0, najbrze: null };
  sledeca(); // poziva se odmah u kliku – YouTube na telefonu traži dodir korisnika
}

function sledeca() {
  gen++;
  zaustaviGlas();
  if (!runda) return;
  runda.poz++;
  if (runda.poz >= runda.red.length) { zavrsiRundu(); return; }
  const k = trenutna();
  faza = 'slusanje';
  ui = { odgovor: false, ponude: [], izabrano: null, najavljeno: false, govori: false, vreme: null };
  t0 = null;
  proteklo = 0;
  ytStanje = -1;
  ucitanoU = Date.now();
  postaviSavet('');
  try {
    player.unMute();
    player.setVolume(100);
    player.loadVideoById({ videoId: k.youtubeId, startSeconds: k.start || 0 });
  } catch (e) {
    console.warn(e);
  }
  renderSve();
}

function krajSlusanja() {
  if (faza !== 'slusanje') return;
  // Ako je "Znam!" kliknuto pre isteka, pamti se za koliko je kompozicija prepoznata.
  if (t0 !== null && proteklo < limit() - 0.05) ui.vreme = proteklo;
  proteklo = limit();
  postaviSavet('');
  const g = gen;
  const k = trenutna();
  if (rezim === 'ucenje') {
    faza = 'glas';
    ui.odgovor = true;
    renderSve();
    if (ui.najavljeno) {
      // Naziv je već izgovoren dugmetom; ako glas još govori, nastavak pokreće njegov kraj.
      if (!ui.govori) predjiNaSledecuUcenje(g);
      return;
    }
    ui.najavljeno = ui.govori = true;
    utisaj(PODESAVANJA.GLASNOCA_ISPOD_GLASA, g, () => {
      izgovori(k, g, () => { ui.govori = false; predjiNaSledecuUcenje(g); });
    });
    return;
  }
  try { player.pauseVideo(); } catch (e) { /* ništa */ }
  faza = 'ceka';
  if (rezim === 'test') pripremiPonude();
  renderSve();
}

// Učenje: kratka pauza posle glasa, muzika se stiša do kraja i ide sledeća kompozicija.
function predjiNaSledecuUcenje(g) {
  setTimeout(() => {
    if (g !== gen) return;
    utisaj(0, g, () => { try { player.pauseVideo(); } catch (e) { /* ništa */ } sledeca(); });
  }, PODESAVANJA.PAUZA_POSLE_GLASA_MS);
}

// Učenje: naziv odmah, a muzika svira dalje (tiše dok glas govori) do isteka vremena.
function najaviOdmah() {
  if (rezim !== 'ucenje' || faza !== 'slusanje' || ui.najavljeno) return;
  const g = gen;
  const k = trenutna();
  ui.najavljeno = ui.govori = true;
  ui.odgovor = true;
  renderSve();
  utisaj(PODESAVANJA.GLASNOCA_ISPOD_GLASA, g, () => {
    izgovori(k, g, () => {
      ui.govori = false;
      if (faza === 'glas') predjiNaSledecuUcenje(g); // vreme je isteklo dok je glas govorio
      else utisaj(100, g);
    });
  });
}

function pripremiPonude() {
  const tacan = trenutnaIdx();
  const kljucTacnog = kljucStavke(LISTA[tacan]);
  const vidjeni = new Set([kljucTacnog]);
  const ostali = [];
  for (const i of promesaj(LISTA.map((k, i) => i))) {
    const kl = kljucStavke(LISTA[i]);
    if (vidjeni.has(kl)) continue;
    vidjeni.add(kl);
    ostali.push(i);
    if (ostali.length === 3) break;
  }
  ui.ponude = promesaj([tacan, ...ostali]);
  ui.izabrano = null;
}

function otkrij() {
  faza = 'otkriveno';
  ui.odgovor = true;
  try { player.setVolume(100); player.playVideo(); } catch (e) { /* ništa */ }
  renderSve();
}

function odgovori(idx) {
  if (faza !== 'ceka' || rezim !== 'test') return;
  const tacno = idx === trenutnaIdx();
  ui.izabrano = idx;
  runda.odgovoreno++;
  if (tacno) {
    runda.tacno++;
    runda.niz++;
    runda.najduziNiz = Math.max(runda.najduziNiz, runda.niz);
    if (ui.vreme !== null && (!runda.najbrze || ui.vreme < runda.najbrze.vreme)) runda.najbrze = { idx: trenutnaIdx(), vreme: ui.vreme };
  } else {
    runda.niz = 0;
    runda.pogresne.push(trenutnaIdx());
  }
  zabeleziOdgovor(trenutna(), tacno);
  otkrij();
}

function zavrsiRundu() {
  gen++;
  zaustaviGlas();
  try { player.stopVideo(); } catch (e) { /* ništa */ }
  faza = 'kraj';
  renderSve();
}

function prekini() {
  gen++;
  zaustaviGlas();
  try { player.stopVideo(); } catch (e) { /* ništa */ }
  runda = null;
  faza = 'start';
  renderSve();
}

/* ---------- Prikaz ---------- */
function postaviSavet(tekst) {
  const el = $('savet');
  if (el.textContent !== tekst) el.textContent = tekst;
}

let tajmerObavestenja = 0;
function obavesti(tekst, ms) {
  const el = $('obavestenje');
  el.textContent = tekst;
  el.hidden = false;
  clearTimeout(tajmerObavestenja);
  tajmerObavestenja = setTimeout(() => { el.hidden = true; }, ms || 4000);
}

function napraviDugme(tekst, klasa, akcija) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'dugme ' + (klasa || '') + (tekst === 'Sledeća' ? ' strelica' : '');
  b.textContent = tekst;
  b.addEventListener('click', akcija);
  return b;
}

const OPISI = {
  ucenje: () => 'Slušaš ' + PODESAVANJA.UCENJE_SEK + ' sekundi, a onda glas kaže ko je kompozitor i kako se delo zove (ili odmah, dugmetom „Reci naziv odmah“). Kompozicije idu same, jedna za drugom.',
  vezba: () => 'Slušaš ' + PODESAVANJA.VEZBA_SEK + ' sekundi i pokušaš da se setiš. Kad prepoznaš (i pre isteka vremena), klikni „Otkrij odgovor“.',
  test: () => 'Slušaš ' + PODESAVANJA.TEST_SEK + ' sekundi i biraš jedan od četiri odgovora (ako znaš ranije, klikni „Znam!“). Na kraju dobijaš rezultat.',
};

function renderStart() {
  const upozorenje = $('upozorenje');
  let poruka = '';
  if (fileGreska || location.protocol === 'file:') {
    poruka = 'Fajl je otvoren direktno sa diska. YouTube tada odbija da pusti video (greška 153). Aplikaciju treba otvoriti preko http(s) linka – pogledaj uputstvo.';
  } else if (apiGreska && !plejerSpreman) {
    poruka = 'YouTube plejer nije mogao da se učita. Proveri internet vezu i osveži stranicu.';
  }
  upozorenje.textContent = poruka;
  upozorenje.hidden = !poruka;

  $('opisRezima').textContent = OPISI[rezim]();

  const btn = $('btnPocni');
  btn.disabled = !plejerSpreman || !LISTA.length || fileGreska;
  btn.textContent = (plejerSpreman ? 'Počni' : apiGreska ? 'Plejer nije dostupan' : 'Učitavam plejer…');

  const ceste = indeksiCestihGresaka();
  $('opcijaCeste').hidden = ceste.length === 0;
  if (!ceste.length) $('samoCeste').checked = false;

  $('infoLista').textContent = 'Broj kompozicija u listi: ' + LISTA.length;

  let infoGlas;
  const snimljenih = LISTA.filter(k => k.audio).length;
  if (snimljenih === LISTA.length) infoGlas = 'Najave: snimljeni srpski glas.';
  else if (snimljenih) infoGlas = ('Snimljene najave: ' + snimljenih + ' od ' + LISTA.length + '. Ostale čita glas pregledača.');
  else if (!imaSintezu) infoGlas = 'Pregledač ne podržava izgovor – naziv će biti prikazan kao tekst.';
  else if (!glas) infoGlas = 'Nije pronađen glas za izgovor – naziv će biti prikazan kao tekst.';
  else {
    const l = (glas.lang || '').toLowerCase();
    const nas = l.startsWith('sr') || l.startsWith('hr') || l.startsWith('bs');
    infoGlas = 'Glas: ' + glas.name + ' (' + glas.lang + ')' + (nas ? '' : ' – nije pronađen srpski ni hrvatski glas');
  }
  $('infoGlas').textContent = infoGlas;

  // Najčešće greške
  const sa = LISTA.map(k => ({ k, s: statistikaZa(k) })).filter(x => x.s && x.s.pogresno > 0)
    .sort((a, b) => b.s.pogresno - a.s.pogresno || a.s.tacno - b.s.tacno).slice(0, 5);
  const imaStatistike = Object.keys(sacuvano.statistika).length > 0;
  $('detaljiGresaka').hidden = !imaStatistike;
  const ol = $('listaGresaka');
  ol.textContent = '';
  if (!sa.length) {
    const li = document.createElement('li');
    li.textContent = 'Još nema grešaka.';
    ol.appendChild(li);
  }
  for (const { k, s } of sa) {
    const li = document.createElement('li');
    li.append(naziv(k) + ' ');
    const br = document.createElement('span');
    br.className = 'brojke';
    br.textContent = '✗ ' + s.pogresno + ' · ✓ ' + s.tacno;
    li.appendChild(br);
    ol.appendChild(li);
  }
  $('btnObrisi').textContent = (potvrdaBrisanja ? 'Klikni ponovo za potvrdu' : 'Obriši napredak');
}

const brojSek = x => x.toFixed(1).replace('.', ',') + ' s';
// 2, 3, 4, 22… "tačna", ostalo "tačnih"
const tacnihZaredom = n => n + (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? ' tačna' : ' tačnih') + ' zaredom';
const tacnoOdgovoreno = () => rezim === 'test' && ui.izabrano !== null && runda && ui.izabrano === trenutnaIdx();

// Gramofon se vrti i ekvilajzer skače samo dok muzika stvarno svira (tiše dok glas govori).
function renderAnimacija() {
  const z = $('zaklon');
  z.classList.toggle('svira', uIgri() && ytStanje === 1);
  z.classList.toggle('tiho', faza === 'glas' || ui.govori);
}

function renderZaklon() {
  const z = $('zaklon');
  const presudjeno = rezim === 'test' && faza === 'otkriveno' && ui.izabrano !== null;
  z.classList.toggle('tacno', presudjeno && tacnoOdgovoreno());
  z.classList.toggle('netacno', presudjeno && !tacnoOdgovoreno());
  let veliko = '♪', malo = 'Prepoznaj kompoziciju';
  if (faza === 'slusanje' && !ui.odgovor) {
    veliko = t0 === null ? '…' : String(Math.max(0, Math.ceil(limit() - proteklo)));
    malo = t0 === null ? 'Učitavam…' : 'Slušaj';
  } else if (faza === 'ceka') {
    veliko = '?';
    malo = rezim === 'test' ? 'Izaberi odgovor' : 'Znaš li šta je ovo?';
  } else if (presudjeno) {
    veliko = tacnoOdgovoreno() ? '✓' : '✗';
    malo = tacnoOdgovoreno() ? 'Tačno' : 'Netačno';
  } else if (uIgri() && ui.odgovor) {
    malo = 'Kompozicija ' + (runda.poz + 1) + '/' + runda.red.length;
  } else if (faza === 'kraj') {
    malo = 'Kraj runde';
  }
  if ($('zaklonVeliko').textContent !== veliko) $('zaklonVeliko').textContent = veliko;
  if ($('zaklonMalo').textContent !== malo) $('zaklonMalo').textContent = malo;
  // Na etiketi ploče piše kompozitor kad je odgovor otkriven, kao na pravoj ploči.
  const etiketa = uIgri() && ui.odgovor ? kompozitor(trenutna()) : '';
  if ($('etiketa').textContent !== etiketa) $('etiketa').textContent = etiketa;
  renderAnimacija();
}

// Prsten oko ploče je tajmer: puni se dok traje slušanje.
function renderTajmer() {
  let p = 0;
  if (faza === 'slusanje') p = Math.min(1, proteklo / limit());
  else if (uIgri()) p = 1;
  $('ploca').style.setProperty('--p', p.toFixed(3));
  renderZaklon();
}

const IKONA_NIZ = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#C8FF4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5c.5 2.5 3.5 4 3.5 7.5a3.5 3.5 0 0 1-7 0c0-1.6.8-2.6 1.6-3.3C6.3 7.3 7 8 7.6 8 7.3 5.5 8 3.5 8 1.5z"></path></svg>';

function renderTraka() {
  if (!runda) return;
  const nap = $('napredak');
  nap.textContent = String(Math.min(runda.poz + 1, runda.red.length));
  const ukupno = document.createElement('small');
  ukupno.textContent = ' / ' + runda.red.length;
  nap.appendChild(ukupno);

  const skor = $('skor');
  skor.hidden = rezim !== 'test';
  skor.textContent = '';
  if (rezim === 'test') {
    const b = document.createElement('b');
    b.textContent = String(runda.tacno);
    skor.append(b, ' / ' + runda.odgovoreno + ' tačno');
  }

  const niz = $('cipNiz');
  niz.hidden = !(rezim === 'test' && runda.niz >= 2);
  if (!niz.hidden) {
    niz.innerHTML = IKONA_NIZ; // statična ikonica iz koda, bez korisničkog teksta
    niz.append('niz ' + runda.niz);
  }
}

function renderOdgovor() {
  const el = $('odgovor');
  el.textContent = '';
  if (!ui.odgovor || !runda || !uIgri()) return;
  const k = trenutna();
  if (rezim === 'test' && ui.izabrano !== null) {
    const p = document.createElement('div');
    p.className = 'presuda ' + (tacnoOdgovoreno() ? 'tacno' : 'netacno');
    p.textContent = tacnoOdgovoreno() ? 'Tačno!' : 'Netačno. Bilo je:';
    el.appendChild(p);
  }
  const n = document.createElement('div');
  n.className = 'naziv';
  const crta = document.createElement('span');
  crta.textContent = ' – ';
  n.append(kompozitor(k), crta, delo(k));
  el.appendChild(n);
  if (tacnoOdgovoreno()) {
    const delovi = [];
    if (ui.vreme !== null) delovi.push('Prepoznato za ' + brojSek(ui.vreme));
    if (runda.niz >= 2) delovi.push(tacnihZaredom(runda.niz));
    if (delovi.length) {
      const d = document.createElement('div');
      d.className = 'dodatak';
      d.textContent = delovi.join(' · ');
      el.appendChild(d);
    }
  }
}

function renderPonude() {
  const el = $('ponude');
  el.textContent = '';
  if (rezim !== 'test' || !ui.ponude.length || !(faza === 'ceka' || faza === 'otkriveno')) return;
  const tacan = trenutnaIdx();
  ui.ponude.forEach((idx, n) => {
    const k = LISTA[idx];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ponuda';
    if (faza === 'otkriveno') {
      b.disabled = true;
      if (idx === tacan) b.classList.add('tacno');
      else if (idx === ui.izabrano) b.classList.add('netacno');
    }
    const broj = document.createElement('span');
    broj.className = 'broj';
    broj.textContent = faza === 'otkriveno' && idx === tacan ? '✓'
      : faza === 'otkriveno' && idx === ui.izabrano ? '✗' : String(n + 1);
    const tekst = document.createElement('span');
    tekst.className = 'tekst';
    const kb = document.createElement('b');
    kb.textContent = kompozitor(k);
    const ds = document.createElement('span');
    ds.textContent = delo(k);
    tekst.append(kb, ds);
    b.append(broj, tekst);
    b.addEventListener('click', () => odgovori(idx));
    el.appendChild(b);
  });
}

function renderDugmad() {
  const el = $('dugmad');
  el.textContent = '';
  if (!runda) return;
  const poslednja = runda.poz >= runda.red.length - 1;
  if (rezim === 'vezba' && (faza === 'slusanje' || faza === 'ceka')) {
    // Dostupno i dok muzika svira: ko odmah prepozna, ne mora da čeka kraj odbrojavanja.
    el.appendChild(napraviDugme('Otkrij odgovor', 'primarno', otkrij));
  } else if (rezim === 'test' && faza === 'slusanje') {
    // Ko prepozna ranije, odmah prelazi na ponude (klip staje kao kad istekne vreme).
    el.appendChild(napraviDugme('Znam! Prikaži odgovore', 'primarno', () => krajSlusanja()));
  } else if (faza === 'otkriveno') {
    el.appendChild(napraviDugme(poslednja ? (rezim === 'test' ? 'Vidi rezultat' : 'Završi') : 'Sledeća', 'primarno', sledeca));
  } else if (rezim === 'ucenje' && faza === 'slusanje' && !ui.najavljeno) {
    el.appendChild(napraviDugme('Reci naziv odmah', 'primarno', najaviOdmah));
  } else if (faza === 'glas' || (rezim === 'ucenje' && faza === 'slusanje')) {
    el.appendChild(napraviDugme(poslednja ? 'Završi' : 'Sledeća', '', sledeca));
  }
}

function renderKraj() {
  const el = $('kraj');
  const dugmad = $('krajDugmad');
  el.textContent = '';
  dugmad.textContent = '';
  if (!runda) return;
  const dodaj = (tag, tekst, klasa) => {
    const e = document.createElement(tag);
    if (klasa) e.className = klasa;
    e.textContent = tekst;
    el.appendChild(e);
    return e;
  };
  const lista = (indeksi) => {
    const ul = document.createElement('ul');
    ul.className = 'kraj-lista';
    for (const i of indeksi) {
      const li = document.createElement('li');
      li.textContent = naziv(LISTA[i]);
      ul.appendChild(li);
    }
    el.appendChild(ul);
  };

  if (rezim === 'test') {
    dodaj('h2', 'Rezultat');
    const rez = dodaj('p', String(runda.tacno), 'rezultat');
    const od = document.createElement('span');
    od.textContent = '/' + runda.odgovoreno;
    rez.appendChild(od);
    if (runda.odgovoreno && !runda.pogresne.length) dodaj('p', 'Sve tačno! Bravo!', 'opis');
    const stat = document.createElement('div');
    stat.className = 'statistike';
    const kocka = (vrednost, opis) => {
      const s = document.createElement('div');
      s.className = 'statistika';
      const v = document.createElement('div');
      v.textContent = vrednost;
      const o = document.createElement('small');
      o.textContent = opis;
      s.append(v, o);
      stat.appendChild(s);
    };
    kocka(String(runda.najduziNiz), 'najduži niz tačnih');
    if (runda.najbrze) kocka(brojSek(runda.najbrze.vreme), 'najbrže: ' + naziv(LISTA[runda.najbrze.idx]));
    else kocka('–', 'najbrže prepoznato (klikni „Znam!“ ranije)');
    el.appendChild(stat);
    if (runda.pogresne.length) {
      dodaj('p', 'Pogrešni odgovori:', 'opis');
      lista(runda.pogresne);
      dodaj('p', 'Savet: prebaci na Učenje pa klikni „Ponovi samo pogrešne“ da ih preslušaš sa nazivima.', 'info');
    }
  } else {
    dodaj('h2', 'Kraj runde');
    dodaj('p', 'Preslušano kompozicija: ' + (runda.red.length - runda.preskocene.length), 'opis');
  }
  if (runda.preskocene.length) {
    dodaj('p', 'Ovi video snimci nisu dostupni (proveri youtubeId u listi):', 'info');
    lista(runda.preskocene);
  }

  const pogresne = runda.pogresne.slice();
  if (pogresne.length) dugmad.appendChild(napraviDugme('Ponovi samo pogrešne', 'primarno', () => pocniRundu(pogresne)));
  dugmad.appendChild(napraviDugme('Nova runda', pogresne.length ? '' : 'primarno', () => pocniRundu(LISTA.map((k, i) => i))));
  dugmad.appendChild(napraviDugme('Nazad na početak', '', prekini));
}

function renderSve() {
  document.querySelectorAll('[data-rezim]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rezim === rezim)));

  $('panelStart').hidden = faza !== 'start';
  $('panelIgra').hidden = !uIgri();
  $('panelKraj').hidden = faza !== 'kraj';
  if (faza !== 'slusanje') postaviSavet('');

  if (faza === 'start') renderStart();
  if (faza === 'kraj') renderKraj();
  renderTraka();
  renderTajmer();
  renderOdgovor();
  renderPonude();
  renderDugmad();
}

/* ---------- Događaji ---------- */
document.querySelectorAll('[data-rezim]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.rezim === rezim) return;
  rezim = b.dataset.rezim;
  sacuvano.rezim = rezim;
  sacuvaj();
  if (uIgri()) prekini(); else renderSve(); // na ekranu "Kraj" ostaje se, pa nova runda ide u novom režimu
}));

$('btnPocni').addEventListener('click', () => {
  const indeksi = $('samoCeste').checked ? indeksiCestihGresaka() : LISTA.map((k, i) => i);
  pocniRundu(indeksi);
});
$('btnPrekini').addEventListener('click', prekini);

$('btnObrisi').addEventListener('click', () => {
  if (!potvrdaBrisanja) {
    potvrdaBrisanja = true;
    tajmerBrisanja = setTimeout(() => { potvrdaBrisanja = false; renderStart(); }, 4000);
  } else {
    clearTimeout(tajmerBrisanja);
    potvrdaBrisanja = false;
    sacuvano.statistika = {};
    sacuvaj();
    obavesti('Napredak je obrisan.');
  }
  renderStart();
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (rezim === 'test' && faza === 'ceka' && /^[1-4]$/.test(e.key)) {
    const idx = ui.ponude[Number(e.key) - 1];
    if (idx !== undefined) odgovori(idx);
  }
});

izaberiGlas();
renderSve();
</script>
<script src="https://www.youtube.com/iframe_api" onerror="apiNijeUcitan()"></script>
</body>
</html>
